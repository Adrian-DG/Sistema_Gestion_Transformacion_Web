<app-encabezado-pagina
  seccion="Inventario"
  titulo="Pólizas"
  descripcion="Seguros de los vehículos. Las pólizas no se eliminan: al renovar se registra una nueva y la anterior queda en el historial."
>
  <a routerLink="nueva" class="btn btn-primario">
    <app-icono nombre="mas" [tamano]="18" /> Nueva póliza
  </a>
</app-encabezado-pagina>

<div class="tarjeta overflow-hidden">
  <div class="border-b border-slate-200 p-4">
    <label class="relative block">
      <span class="sr-only">Buscar pólizas</span>
      <app-icono
        nombre="buscar"
        [tamano]="18"
        class="pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-slate-400"
      />
      <input
        type="search"
        class="control pl-10"
        placeholder="Buscar por número de póliza, placa, matrícula o aseguradora"
        [value]="q()"
        (input)="buscar($any($event.target).value)"
      />
    </label>
  </div>

  <app-tabla
    [columnas]="columnas"
    [filas]="filas()"
    [cargando]="cargando()"
    [mensajeVacio]="q() ? 'Ninguna póliza coincide con la búsqueda' : 'No hay pólizas registradas'"
  >
    <ng-template appCelda="numero" let-p>
      <a
        [routerLink]="[p.id, 'editar']"
        class="font-mono font-semibold text-slate-900 hover:text-primario hover:underline"
        >{{ p.numeroPoliza }}</a
      >
      <span class="block text-xs text-slate-500">{{ p.aseguradora }}</span>
    </ng-template>

    <ng-template appCelda="vehiculo" let-p>
      <span class="block font-mono text-slate-900">{{ p.placa }}</span>
      <span class="block text-xs text-slate-500">{{ p.vehiculo }}</span>
    </ng-template>

    <ng-template appCelda="vigencia" let-p>
      <span class="whitespace-nowrap">
        {{ p.fechaEfectividad | date: 'dd/MM/y' }} – {{ p.fechaVencimiento | date: 'dd/MM/y' }}
      </span>
    </ng-template>

    <ng-template appCelda="cobertura" let-p>
      <app-estado-badge [estado]="nombreCobertura(p)" />
      <span class="mt-0.5 block text-xs text-slate-500">{{ diasTexto(p.diasRestantes) }}</span>
    </ng-template>

    <ng-template appCelda="acciones" let-p>
      <div class="flex justify-end gap-1">
        <a
          routerLink="nueva"
          [queryParams]="{ renovar: p.id }"
          class="btn btn-texto btn-sm"
          [attr.aria-label]="'Renovar póliza ' + p.numeroPoliza"
        >
          Renovar
        </a>
        <a
          [routerLink]="[p.id, 'editar']"
          class="btn btn-texto btn-sm"
          [attr.aria-label]="'Editar póliza ' + p.numeroPoliza"
        >
          Editar
        </a>
      </div>
    </ng-template>
  </app-tabla>

  <app-paginador
    [pagina]="pagina()"
    [tamano]="tamano()"
    [total]="total()"
    (cambio)="paginar($event)"
  />
</div>
