<a
  routerLink="/inventario-piezas/entradas"
  class="mb-4 inline-flex items-center gap-1 text-sm text-slate-600 hover:text-primario"
>
  <app-icono nombre="izquierda" [tamano]="16" /> Entradas al inventario
</a>

<app-encabezado-pagina
  seccion="Taller · Inventario"
  titulo="Registrar entrada"
  descripcion="Compra de piezas a un proveedor. Las cantidades se suman a la existencia y el costo queda en el kardex."
/>

<form [formGroup]="formulario" (ngSubmit)="guardar()" novalidate class="space-y-6">
  @if (errorGeneral(); as mensaje) {
    <div
      class="flex items-start gap-2 rounded-md border border-red-200 bg-red-50 p-3 text-sm text-red-800"
      role="alert"
    >
      <app-icono nombre="error" [tamano]="18" class="mt-0.5" />
      <span>{{ mensaje }}</span>
    </div>
  }

  <section class="tarjeta" aria-labelledby="sec-factura">
    <h2 id="sec-factura" class="border-b border-slate-200 px-5 py-3 font-semibold text-slate-900">
      Factura
    </h2>
    <div class="grid gap-5 p-5 sm:grid-cols-2 lg:grid-cols-3">
      <app-campo
        etiqueta="Proveedor"
        para="proveedorId"
        [control]="formulario.controls.proveedorId"
        requerido
      >
        <select id="proveedorId" class="control" formControlName="proveedorId">
          <option [ngValue]="null" disabled>Seleccione…</option>
          @for (p of proveedores(); track p.id) {
            <option [ngValue]="p.id">{{ p.nombre }}</option>
          }
        </select>
      </app-campo>
      <app-campo
        etiqueta="Número de factura"
        para="numeroFactura"
        [control]="formulario.controls.numeroFactura"
      >
        <input id="numeroFactura" class="control font-mono" formControlName="numeroFactura" />
      </app-campo>
      <app-campo etiqueta="Fecha" para="fecha" [control]="formulario.controls.fecha" requerido>
        <input id="fecha" type="date" class="control" [max]="hoy" formControlName="fecha" />
      </app-campo>
      <app-campo
        etiqueta="Observación"
        para="observacion"
        [control]="formulario.controls.observacion"
        class="sm:col-span-2"
      >
        <input id="observacion" class="control" formControlName="observacion" />
      </app-campo>
      <app-campo
        etiqueta="Factura (opcional)"
        para="factura"
        [control]="formulario.controls.factura"
      >
        <app-selector-archivo idControl="factura" formControlName="factura" />
      </app-campo>
    </div>
  </section>

  <section class="tarjeta" aria-labelledby="sec-lineas">
    <header class="flex items-center justify-between border-b border-slate-200 px-5 py-3">
      <h2 id="sec-lineas" class="font-semibold text-slate-900">Piezas</h2>
      <button type="button" class="btn btn-texto btn-sm" (click)="agregarLinea()">
        <app-icono nombre="mas" [tamano]="16" /> Agregar pieza
      </button>
    </header>
    <div class="divide-y divide-slate-100" formArrayName="lineas">
      @for (linea of lineas.controls; track linea; let i = $index) {
        <div
          class="grid gap-4 p-5 sm:grid-cols-[1fr_8rem_10rem_auto] sm:items-end"
          [formGroupName]="i"
        >
          <app-campo
            etiqueta="Pieza"
            [para]="'pieza-' + i"
            [control]="linea.controls.piezaId"
            requerido
          >
            <select [id]="'pieza-' + i" class="control" formControlName="piezaId">
              <option [ngValue]="null" disabled>Seleccione…</option>
              @for (p of piezas(); track p.id) {
                <option [ngValue]="p.id">{{ p.nombre }} ({{ p.codigo }})</option>
              }
            </select>
          </app-campo>
          <app-campo
            [etiqueta]="'Cantidad ' + unidad(linea.controls.piezaId.value)"
            [para]="'cantidad-' + i"
            [control]="linea.controls.cantidad"
            requerido
          >
            <input
              [id]="'cantidad-' + i"
              type="number"
              min="0.01"
              step="0.01"
              class="control"
              formControlName="cantidad"
            />
          </app-campo>
          <app-campo
            etiqueta="Costo unitario (RD$)"
            [para]="'costo-' + i"
            [control]="linea.controls.costoUnitario"
            requerido
          >
            <input
              [id]="'costo-' + i"
              type="number"
              min="0"
              step="0.01"
              class="control"
              formControlName="costoUnitario"
            />
          </app-campo>
          <button
            type="button"
            class="btn btn-texto btn-sm !text-red-700"
            [disabled]="lineas.length === 1"
            (click)="quitarLinea(i)"
            [attr.aria-label]="'Quitar línea ' + (i + 1)"
          >
            <app-icono nombre="cerrar" [tamano]="16" />
          </button>
        </div>
      }
    </div>
    <footer class="flex justify-end border-t border-slate-200 px-5 py-3 text-sm">
      Total: <span class="ml-2 font-semibold">{{ moneda(totalEntrada()) }}</span>
    </footer>
  </section>

  <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
    <a routerLink="/inventario-piezas/entradas" class="btn btn-contorno">Cancelar</a>
    <button type="submit" class="btn btn-primario" [disabled]="guardando()">
      @if (guardando()) {
        <app-cargando class="text-current" />
      }
      Registrar entrada
    </button>
  </div>
</form>
